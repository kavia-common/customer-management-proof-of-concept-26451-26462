<section class="page">
  <header class="page-header">
    <div>
      <a class="back" routerLink="/customers">← Customers</a>
      <h1 class="title">{{ customer()?.name ?? ('Customer #' + id()) }}</h1>
      <p class="subtitle">
        Detail view
        @if (noticeMessage()) { — ✓ {{ noticeMessage() }} }
        @if (errorMessage()) { — {{ errorMessage() }} }
      </p>
    </div>

    <div class="actions">
      <button class="secondary-btn" type="button" (click)="openEdit()" [disabled]="!customer()">
        Edit
      </button>
      <button class="danger-btn" type="button" (click)="onDelete()" [disabled]="!customer()">
        Delete
      </button>
    </div>
  </header>

  <div class="panel">
    <div class="row">
      <div class="label">Status</div>
      <div class="value">
        <span class="badge">{{ customer()?.status ?? 'Active' }}</span>
      </div>
    </div>

    <div class="row">
      <div class="label">Email</div>
      <div class="value" [class.muted]="!customer()?.email">{{ customer()?.email ?? '—' }}</div>
    </div>

    <div class="row">
      <div class="label">Notes</div>
      <div class="value" [class.muted]="!customer()?.notes">
        {{ customer()?.notes ?? '—' }}
      </div>
    </div>
  </div>

  <app-customer-form-modal
    [open]="modalOpen()"
    mode="edit"
    [customer]="customer()"
    [saving]="modalSaving()"
    [errorMessage]="modalError()"
    (closed)="closeModal()"
    (submitted)="onModalSubmitted($event)"
  />
</section>
