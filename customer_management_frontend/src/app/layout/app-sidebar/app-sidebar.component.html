<aside class="sidebar" aria-label="Primary navigation">
  <div class="section">
    <div class="section-title">Workspace</div>

    <a
      class="nav-item"
      routerLink="/customers"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="dot" aria-hidden="true"></span>
      Customers
    </a>
  </div>

  <div class="section secondary">
    <div class="section-title">System</div>

    <div class="hint">
      Backend URL is configured via <code>NG_APP_API_BASE</code>/<code>NG_APP_BACKEND_URL</code>.
      <br />
      Status:
      @if (status() === 'ok') {
        <strong>Reachable</strong>
      } @else if (status() === 'down') {
        <strong>Unreachable</strong>
        @if (detail()) { <span>— {{ detail() }}</span> }
      } @else {
        <strong>Checking…</strong>
      }
      <br />
      <button type="button" class="linklike" (click)="refreshBackendStatus()">Re-check</button>
    </div>
  </div>
</aside>
